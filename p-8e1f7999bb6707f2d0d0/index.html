  var ITER = 600000;
  function expired(){
    if (Date.now() < END) return false;
    var lock = document.getElementById("lock");
    if (lock) lock.remove();
    var pg = document.getElementById("pg");
    if (pg) pg.remove();
    document.getElementById("gone").style.display = "block";
    document.title = "This access page has expired";
    return true;
  }
  expired();
  setInterval(expired, 60000);
  function b64(s){
    var bin = atob(s);
    var u = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  async function derive(pass, salt){
    var enc = new TextEncoder();
    var material = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"},
      material,
      {name:"AES-GCM", length:256},
      false,
      ["decrypt"]
    );
  }
  async function unlock(pass){
    var key = await derive(pass, b64(SALT));
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(CT));
    return new TextDecoder().decode(pt);
  }
  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (expired()) return;
    var pass = document.getElementById("pw").value.trim();
    var err = document.getElementById("err");
    err.textContent = "";
    unlock(pass).then(function(html){
      if (expired()) return;
      document.open();
      document.write(html);
      document.close();
    }).catch(function(){
      err.textContent = "That passcode did not work. Try again.";
    });
  });
